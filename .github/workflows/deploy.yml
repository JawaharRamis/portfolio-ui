name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Show build output
        run: ls -la dist/

  # Vercel auto-deploys on push - no additional steps needed
  # The project is linked and will deploy automatically on main branch push
